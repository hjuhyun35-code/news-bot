name: daily draft

# 소재 하나를 골라 카드까지 만들고, 독자 관문을 통과하면 올린다.
# 걸리면 올리지 않고 텔레그램으로 승인 단추를 보낸다.
#
# 하루 편수는 day_plan.py 가 정한다. 예약을 편수만큼만 걸면 깃허브가
# 건너뛸 때마다 그날 몫이 그대로 날아가서, 넉넉히 걸어두고 세는 쪽으로
# 바꿨다. 실제로 2026-08-05 아침 7시 17분 예약은 통째로 걸렀다.
on:
  schedule:
    - cron: "17 22 * * *"    # 한국 07:17
    - cron: "47 1 * * *"     # 한국 10:47
    - cron: "23 5 * * *"     # 한국 14:23
    - cron: "53 8 * * *"     # 한국 17:53
    - cron: "19 12 * * *"    # 한국 21:19
  workflow_dispatch:
    inputs:
      slug:
        description: "leave empty to let day_plan.py decide"
        required: false
      ignore_quota:
        description: "yes = 오늘 몫을 다 썼어도 하나 더 만든다"
        required: false
        default: "no"
      new_subject:
        description: "yes = 밀린 초안을 건너뛰고 새 소재로 만든다"
        required: false
        default: "no"

# 예약이 몰려서 두 개가 겹쳐 돌면 같은 소재를 두 번 만든다.
concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 사진 찾기가 여기 들어와서 미리 깔아야 한다. 크롬은 아직이다 —
      # 할 일이 없으면 크롬 없이 끝낸다.
      - run: pip install anthropic pillow

      # 오늘 몫이 남았는지, 무엇을 할 차례인지, 그 소재에 쓸 사진이 있는지
      # 까지 여기서 정한다. 사진이 모자란 소재는 빼두고 다음 것을 집는다.
      - name: plan the day
        id: plan
        env:
          IGNORE_QUOTA: ${{ inputs.ignore_quota }}
          NEW_SUBJECT: ${{ inputs.new_subject }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            echo "stop=no" >> "$GITHUB_OUTPUT"
            echo "mode=make" >> "$GITHUB_OUTPUT"
            echo "slug=${{ inputs.slug }}" >> "$GITHUB_OUTPUT"
            echo "손으로 지정: ${{ inputs.slug }}"
            if [ ! -f "posts/${{ inputs.slug }}/source.json" ]; then
              python scripts/find_images.py "${{ inputs.slug }}"
            fi
          else
            python scripts/day_plan.py
          fi

      # 빼둔 소재와 내려받은 사진을 먼저 남긴다. 뒤에서 실패하더라도
      # 같은 소재를 다시 붙잡고 늘어지지 않게 하려는 것이다.
      - name: commit the queue and photos
        if: always() && steps.plan.outputs.stop != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue.json posts
          git diff --staged --quiet && echo "nothing new" || git commit -m "photos: ${{ steps.plan.outputs.slug }}"
          git pull --rebase --autostash -q
          git push

      # 소재를 건너뛴 것은 사고가 아니다. 실패 알림 말고 안내로 보낸다.
      - name: mention what was skipped
        if: steps.plan.outputs.skipped != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify.py "사진이 모자라 건너뛴 소재: ${{ steps.plan.outputs.skipped }}
          목록에서 빼뒀습니다. 오늘 것은 ${{ steps.plan.outputs.slug }} 로 만듭니다."

      # 발행 모드에서도 크롬이 필요하다. 밀린 초안에 독자 반응이 없으면
      # 여기서 받아야 하고, 못 알아보겠다는 카드는 다시 그려야 한다.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        if: steps.plan.outputs.stop != 'yes'
        with:
          chrome-version: stable

      - name: let readers pick the cover
        if: steps.plan.outputs.stop != 'yes' && steps.plan.outputs.mode == 'make'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/pick_cover.py "${{ steps.plan.outputs.slug }}"

      - name: write the script
        if: steps.plan.outputs.stop != 'yes' && steps.plan.outputs.mode == 'make'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/write_post.py "${{ steps.plan.outputs.slug }}"

      - name: render the cards
        if: steps.plan.outputs.stop != 'yes' && steps.plan.outputs.mode == 'make'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/render_cards.py "${{ steps.plan.outputs.slug }}"

      # 발행 모드에서도 돌린다. 관문이 독자 반응을 요구하는데, 반응이 없는
      # 초안은 영영 통과하지 못하고 승인 단추만 기다리게 된다. wardenclyffe
      # 가 그랬다 — 독자 검토 기능이 생기기 전에 만들어진 초안이다.
      - name: ask the readers
        if: steps.plan.outputs.stop != 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "posts/${{ steps.plan.outputs.slug }}/readers.json" ]; then
            echo "독자 반응은 이미 있습니다"
          else
            python scripts/reader_reactions.py "${{ steps.plan.outputs.slug }}"
          fi

      - name: fix what readers could not read
        if: steps.plan.outputs.stop != 'yes'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/fix_unreadable.py "${{ steps.plan.outputs.slug }}"

      # 카드는 저장소 주소로 텔레그램에 보낸다. 보내기 전에 올라가 있어야 한다.
      - name: commit the draft
        if: steps.plan.outputs.stop != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "posts/${{ steps.plan.outputs.slug }}"
          git diff --staged --quiet && echo "nothing new" || git commit -m "draft: ${{ steps.plan.outputs.slug }}"
          git pull --rebase --autostash -q
          git push

      # 2026-08-09 부터 캐러셀은 올리지 않는다. 사장님이 "카드뉴스는 거의
      # 안 보인다"고 하셨고, 실제로 새 계정에 도달을 주는 것은 릴스다.
      # 카드는 계속 만든다 — 릴스의 장면이 그 카드다.
      #
      # 릴스는 인스타에 API 로 올리지 않는다. 음원을 앱에서만 붙일 수
      # 있고, 이미 올라간 릴스의 음원은 바꿀 수 없다. 그래서 영상을
      # 텔레그램으로 보내고 사장님이 앱에서 올리신다.
      - run: pip install edge-tts
        if: steps.plan.outputs.stop != 'yes'

      - name: make sure ffmpeg is here
        if: steps.plan.outputs.stop != 'yes'
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg

      - name: make the reel
        if: steps.plan.outputs.stop != 'yes'
        run: python scripts/make_reel.py "${{ steps.plan.outputs.slug }}"

      - name: send the reel
        if: steps.plan.outputs.stop != 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_reel.py "${{ steps.plan.outputs.slug }}"

      # 영상 파일은 저장소에 넣지 않는다. 하나에 15MB라 몇 달이면 감당
      # 못 한다. 완료 표시와 카드만 남긴다.
      - name: record what was done
        if: always() && steps.plan.outputs.stop != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f posts/*/reel*.mp4
          git add -A posts
          git diff --staged --quiet && echo "nothing new" || git commit -m "reel: ${{ steps.plan.outputs.slug }}"
          git pull --rebase --autostash -q
          git push

      # 실패했다는 알림은 여기서 보내지 않는다. retry 워크플로가 실패를
      # 받아 다시 시도하고, 그때 무슨 일이 벌어지는지 한 번만 알린다.
      # 여기서도 보내면 실패할 때마다 두 통이 간다.
