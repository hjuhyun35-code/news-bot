name: check approvals

# 텔레그램에서 누른 승인 단추를 읽어 발행한다.
# 승인이 없으면 아무 일도 하지 않는다. 걸리는 시간은 15초 안팎이다.
#
# 정각과 30분은 전 세계 예약 작업이 몰리는 시각이라 깃허브가 자주 미루거나
# 건너뛴다. 실제로 "*/30" 으로 걸어둔 19시간 동안 한 번도 안 걸렸다.
# 어중간한 분으로 옮겼더니 좀 나아졌지만, 2026-08-05 에 세어 보니 시간당
# 두 번 걸어둔 것이 4~6시간에 한 번 돌고 있었다. 단추를 누르고 몇 시간을
# 기다리게 된다.
#
# 깃허브가 얼마나 걸러낼지는 우리가 못 정한다. 정할 수 있는 것은 몇 번
# 부탁하느냐뿐이라, 시간당 여섯 번으로 늘린다. 같은 비율로 걸러져도
# 한 시간 안에는 한 번 돈다.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      test_button:
        description: "send a fresh test button before checking"
        required: false
        default: "no"

# 두 개가 겹쳐 돌면 같은 승인을 두 번 처리할 수 있다.
concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: send a test button
        if: inputs.test_button == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py --button "시험용입니다. 이 글의 단추를 눌러주세요."

      - name: read the buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 발행 자리를 잡을 때 쓴다. 없으면 두 번 올라갈 수 있다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_approvals.py

      # 올렸다는 표시를 남긴다. 이게 있어야 다음 실행이 또 올리지 않는다.
      - name: commit the markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git diff --staged --quiet && echo "nothing new" || git commit -m "published / rejected markers"
          git pull --rebase --autostash
          git push
