name: check approvals

# 텔레그램에서 누른 승인 단추를 읽어 발행한다.
# 승인이 없으면 아무 일도 하지 않는다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# 두 개가 겹쳐 돌면 같은 승인을 두 번 처리할 수 있다.
concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: read the buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/check_approvals.py

      # 올렸다는 표시를 남긴다. 이게 있어야 다음 실행이 또 올리지 않는다.
      - name: commit the markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git diff --staged --quiet && echo "nothing new" || git commit -m "published / rejected markers"
          git pull --rebase --autostash
          git push
