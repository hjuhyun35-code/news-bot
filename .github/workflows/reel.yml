name: make reel

# 이미 만들어둔 카드로 릴스용 세로 영상을 만든다. 인스타에 올리지는
# 않는다 — 음원은 사장님이 앱에서 올리실 때 직접 고르셔야 하고,
# 인스타는 이미 올라간 릴스의 음원을 바꿔주지 않는다.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "post folder name under posts/"
        required: true
      voice:
        description: "uk / us / both / none"
        required: false
        default: "both"
      headline_only:
        description: "yes = 제목만 읽는다. no = 설명까지"
        required: false
        default: "no"
      cards:
        description: "릴스에 쓸 카드 수. 0이면 전부. 압축은 4"
        required: false
        default: "4"

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow edge-tts

      - name: make sure ffmpeg is here
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg

      - name: build
        env:
          SLUG: ${{ inputs.slug }}
          VOICE: ${{ inputs.voice }}
          HEADLINE_ONLY: ${{ inputs.headline_only }}
          CARDS: ${{ inputs.cards }}
        run: |
          extra="--cards ${CARDS:-0}"
          [ "$HEADLINE_ONLY" = "yes" ] && extra="$extra --headline-only"

          case "$VOICE" in
            none) python scripts/make_reel.py "$SLUG" --no-tts $extra ;;
            both)
              python scripts/make_reel.py "$SLUG" --voice uk --out reel-uk.mp4 $extra
              python scripts/make_reel.py "$SLUG" --voice us --out reel-us.mp4 $extra
              ;;
            *) python scripts/make_reel.py "$SLUG" --voice "$VOICE" $extra ;;
          esac

      # 영상은 텔레그램으로 보낸다. 휴대폰에서 바로 저장해 인스타 앱으로
      # 넘어갈 수 있어야 한다. 깃허브 첨부파일은 컴퓨터에서 받아 휴대폰으로
      # 옮기는 일이 한 번 더 있다.
      #
      # 저장소에는 넣지 않는다. 하나에 15~25MB라 몇 달이면 감당 못 한다.
      - name: send to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_reel.py "${{ inputs.slug }}"

      # 텔레그램이 안 될 때를 위한 뒷길. 30일 뒤 저절로 사라진다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-${{ inputs.slug }}
          path: |
            posts/${{ inputs.slug }}/reel*.mp4
            posts/${{ inputs.slug }}/reel_cover.jpg
          retention-days: 30

      - name: report a failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify.py "릴스 만들기가 실패했습니다: ${{ inputs.slug }}
          기록: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
