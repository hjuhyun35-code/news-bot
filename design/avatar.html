<meta charset="utf-8">
<title>avatar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; overflow:hidden; }
  .a { display:none; width:1080px; height:1080px; position:relative;
       align-items:center; justify-content:center; overflow:hidden; }
  body.a1 #a1, body.a2 #a2, body.a3 #a3 { display:flex; }
  /* everything lives inside the inscribed circle — Instagram crops to a circle */

  /* A ─ yellow ground, black monogram. loudest at 30px. */
  #a1 { background:#FFD23F; }
  #a1 .gn { font-family:Impact, Haettenschweiler, 'Arial Narrow', sans-serif;
            font-size:560px; line-height:.78; color:#0A0C10; letter-spacing:-.035em; }

  /* B ─ dark ground, yellow monogram */
  #a2 { background:#0D0F14; }
  #a2 .gn { font-family:Impact, Haettenschweiler, 'Arial Narrow', sans-serif;
            font-size:560px; line-height:.78; color:#FFD23F; letter-spacing:-.035em; }

  /* C ─ the name, literally: an inverted plate in a yellow frame */
  #a3 { background:#0D0F14; }
  #a3 .plate { width:472px; height:590px; border:20px solid #FFD23F;
               position:relative; overflow:hidden; }
  #a3 img { width:100%; height:100%; object-fit:cover;
            object-position:52% 46%; transform:scale(2.4);
            filter:grayscale(1) invert(1) contrast(2.1) brightness(.98); }
</style>

<div class="a" id="a1"><div class="gn">GN</div></div>
<div class="a" id="a2"><div class="gn">GN</div></div>
<div class="a" id="a3"><div class="plate"><img src="img/forest.jpg"></div></div>

<script>
  document.body.className = 'a' + (new URLSearchParams(location.search).get('v') || '1');
</script>
